services:
  postgres:
    image: postgres:18
    container_name: moex-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d:ro

volumes:
  data: